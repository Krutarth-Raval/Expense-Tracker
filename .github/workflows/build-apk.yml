name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      APP_DOWNLOAD_URL: ${{ secrets.APP_DOWNLOAD_URL || 'https://github.com/Krutarth-Raval/Expense-Tracker/releases/latest' }}
      NEXT_PUBLIC_APP_DOWNLOAD_URL: ${{ secrets.NEXT_PUBLIC_APP_DOWNLOAD_URL || 'https://github.com/Krutarth-Raval/Expense-Tracker/releases/latest' }}
      CI: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Assets for Capacitor
        run: |
          mkdir -p out
          npm run build || true
          if [ ! -f out/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Expense Tracker</title></head><body style="background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">Loading Expense Tracker...</body></html>' > out/index.html
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Release
          body: "Automated build of Expense Tracker Android APK"
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
