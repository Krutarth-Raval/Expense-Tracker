<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Expense Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">₹</div>
    <h1>Expense Tracker</h1>
    <div class="spinner"></div>
    <p id="status-text">Connecting to server...</p>
  </div>

  <script>
    (function() {
      var serverUrl = localStorage.getItem('expense_tracker_server_url') || window.CAPACITOR_SERVER_URL;
      if (!serverUrl) {
        // Fallback default
        serverUrl = 'https://track-your-money-one.vercel.app';
      }
      
      if (serverUrl && navigator.onLine) {
        window.location.replace(serverUrl);
      } else {
        var status = document.getElementById('status-text');
        if (status) {
          status.innerText = navigator.onLine ? 'Redirecting...' : 'Please connect to the internet';
        }
      }
    })();
  </script>
</body>
</html>
